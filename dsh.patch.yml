# Manager proxies present remote browser requests to the Host as loopback, so
# DSH's boot-time auto picker may otherwise choose an OS dialog the remote user
# cannot see. Disable that row by its original name and mount the browse pair.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true
- insert:
    - id: dsh-manager-plugin
      name: '@nevermindzzt/dsh-manager-plugin'
    - id: dsh-manager-directory-picker-browse-host
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: dsh-manager-directory-picker-browse-client
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
